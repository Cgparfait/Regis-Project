<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — IMYENDA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/admin.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="auth-logo-text">IMYENDA</span>
      </div>
      <h1 class="auth-title">Admin Sign In</h1>
      <p class="auth-subtitle">Sign in to manage your collection and messages.</p>

      <div id="authAlert"></div>

      <form id="authForm">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tabSignin">Sign In</button>
          <button type="button" class="auth-tab" id="tabSignup">Create Account</button>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="form-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" class="form-input with-icon" id="authEmail" placeholder="admin@imyenda.rw" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="form-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" class="form-input with-icon" id="authPassword" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="form-submit" id="authSubmit">
          <span id="authSubmitText">Sign In</span>
        </button>
      </form>

      <a href="/" class="auth-back">← Back to site</a>
    </div>
  </div>

  <script src="/js/signin.js"></script>
</body>
</html>
