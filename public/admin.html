<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — IMYENDA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/admin.css" rel="stylesheet" />
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-header-inner">
      <a class="admin-brand" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        IMYENDA Admin
      </a>
      <div class="admin-header-right">
        <span class="admin-user-email" id="adminEmail"></span>
        <button class="admin-logout" id="logoutBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <nav class="admin-tabs">
    <div class="admin-tabs-inner">
      <button class="admin-tab active" id="tabInventory">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8H21"/><path d="M21 12H21"/><path d="M21 16H21"/><path d="M3 8H3"/><path d="M3 12H3"/><path d="M3 16H3"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Inventory
      </button>
      <button class="admin-tab" id="tabContacts">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
        <span class="admin-tab-badge" id="contactsBadge" style="display:none">0</span>
      </button>
    </div>
  </nav>

  <div class="admin-content">
    <!-- Inventory Panel -->
    <div class="admin-panel active" id="panelInventory">
      <div class="admin-panel-header">
        <h1 class="admin-panel-title">Inventory Management</h1>
        <button class="admin-add-btn" id="addBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Item
        </button>
      </div>
      <div id="inventoryTable"></div>
    </div>

    <!-- Contacts Panel -->
    <div class="admin-panel" id="panelContacts">
      <div class="admin-panel-header">
        <h1 class="admin-panel-title">Contact Submissions</h1>
      </div>
      <div id="contactsList"></div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
